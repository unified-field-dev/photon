# cargo-deny configuration for Photon.
# See docs/supply-chain.md for Git dependency policy.

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates are transitive via broker SDKs (no safe upgrade path yet).
# rustls-webpki advisories cleared by bumping async-nats to 0.50.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "unmaintained instant; transitive via broker SDKs" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste; transitive via broker SDKs" },
    { id = "RUSTSEC-2025-0134", reason = "unmaintained rustls-pemfile; transitive via broker SDKs" },
    # 2026-10-14: fluvio 0.50.1 (latest) pulls serde_yaml 0.9.34+deprecated, which pulls unsafe-libyaml.
    # No patched release; revisit when Fluvio moves off serde_yaml. See BACKLOG ammonia_rustsec_2021_0157_0158_01.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained unsafe-libyaml; transitive via fluvio -> serde_yaml" },
    # 2026-10-27: rskafka 0.6.0 and fluvio-compression 0.50.1 both pin `zstd = "0.13"`, which caps
    # zstd-safe on the 7.x line too. No patched zstd (>=0.14.3) or zstd-safe (>=8.2.0) is reachable
    # until one of those crates releases a version that loosens the pin.
    { id = "RUSTSEC-2026-0391", reason = "zstd pinned to 0.13 by rskafka/fluvio-compression; no reachable patch" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe capped at 7.x by zstd 0.13's own pin; no reachable patch" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe capped at 7.x by zstd 0.13's own pin; no reachable patch" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
